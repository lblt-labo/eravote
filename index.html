<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="エラボオト">

<style>
:root{--bg:#FAF7F0;--ink:#222;--sub:#555;--line:#D8D2C4;--card:#fff;--main:#0072B2;--r:#D55E00;--y:#F0E442;--b:#0072B2;--g:#009E73}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--ink);background:#fff;padding:0 14px;transition:transform .12s}
button:active{transform:scale(.94)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #000;outline-offset:2px}
header{background:var(--main);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
header .t{flex:1}
header h1{margin:0;font-size:1.3rem}
header p{margin:0;font-size:.8rem}
#helpBtn,#setBtn{border-color:#fff;border-radius:50%;width:44px;padding:0;font-size:1.2rem}
main{max-width:640px;margin:0 auto;padding:12px}
label.l{font-size:.85rem;font-weight:bold;display:block;margin-bottom:4px}
textarea,input[type=text],input[type=url],select{width:100%;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
#memo{height:70px;resize:vertical}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;border-color:var(--line);background:#fff;flex:none}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:bold}
.tab.gt{border-radius:999px}.tab.gt.on{background:var(--main);border-color:var(--main)}.tabs.gen{padding-top:4px}
.tab.add{border-style:dashed}
.bar{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.bar select{flex:1}
.bar .hint{font-size:.75rem;color:var(--sub);flex:2}
details.form{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
details.form summary{min-height:44px;display:flex;align-items:center;font-weight:bold;cursor:pointer}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{flex:1}
.primary{background:var(--main);color:#fff;border-color:var(--main);font-weight:bold;width:100%;margin-top:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;animation:pop .25s}
.card.sel-g{border-color:var(--g);border-width:3px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;gap:8px;align-items:flex-start}
.top h3{margin:0;font-size:1.05rem;flex:1;word-break:break-all}
.len{font-size:.85rem;color:var(--sub);white-space:nowrap}
.note{font-size:.9rem;color:var(--sub);margin:4px 0;white-space:pre-wrap;word-break:break-all}
.acts{display:flex;gap:8px;margin-top:8px;align-items:center}
.link{display:inline-flex;align-items:center;text-decoration:none;color:var(--main);border:2px solid var(--main);border-radius:12px;padding:0 14px;min-height:44px;font-weight:bold}
.del{margin-left:auto;border-color:var(--line);color:var(--sub)}
.seals{display:flex;gap:6px;margin-top:10px;justify-content:space-between}
.seal{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:2px;min-width:60px;flex:1;font-size:.7rem}
.dot{width:44px;height:44px;border-radius:50%;border:2px dashed #888;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.1rem;color:transparent;transition:all .15s}
.seal[aria-pressed=true] .dot{transform:scale(1.18);border:4px solid #000;box-shadow:0 0 0 3px #fff,0 0 0 5px #000;color:#000}
.seal[aria-pressed=true]{font-weight:bold}
.seal[aria-pressed=true] .st{background:#000;color:#fff;border-radius:6px;padding:0 6px}
.seal[data-c=r] .dot{background:#fff;border-color:var(--r)}.seal[data-c=y] .dot{border-color:#b3a800}.seal[data-c=b] .dot{border-color:var(--b)}.seal[data-c=g] .dot{border-color:var(--g)}
.seal[data-c=r][aria-pressed=true] .dot{background:var(--r)}.seal[data-c=y][aria-pressed=true] .dot{background:var(--y)}.seal[data-c=b][aria-pressed=true] .dot{background:var(--b);color:#fff}.seal[data-c=g][aria-pressed=true] .dot{background:var(--g);color:#fff}
.empty{text-align:center;color:var(--sub);padding:24px 0}
.tools{display:flex;gap:8px;margin-top:16px}
.tools button{flex:1}
.arc{width:100%;margin-top:16px;border-color:var(--main);color:var(--main);font-weight:bold}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:85vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 10px;font-size:1.15rem}
.modal ol{padding-left:1.2rem}.modal li{margin-bottom:8px}
.modal h4{margin:12px 0 4px;border-bottom:2px solid var(--line)}
.modal ul{margin:0;padding-left:1.2rem}
.close{width:100%;margin-top:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;font-size:.9rem}
#toast.on{opacity:1}
#inst{position:fixed;left:10px;right:10px;bottom:10px;background:#000;color:#fff;border-radius:16px;padding:12px;display:flex;gap:8px;align-items:center;transform:translateY(150%);transition:transform .5s;z-index:60;max-width:620px;margin:0 auto}
#inst.on{transform:none}
#inst span{flex:1;font-size:.85rem}
#inst button{border-color:#fff;background:#fff;color:#000;font-size:.85rem}
#inst .x{background:none;color:#fff}
</style>
</head>
<body>
<header>
  <div class="t"><h1>エラボオト</h1><p>曲を集めて、ペタッと選ぼう</p></div>
  <button id="helpBtn" type="button" aria-label="使い方を見る">❓</button>
  <button id="setBtn" type="button" aria-label="設定を開く">⚙️</button>
</header>
<main>
  <div class="tabs gen" id="genres" role="tablist" aria-label="ジャンル"></div>
  <label class="l" for="memo">📝 イベント・目標メモ</label>
  <textarea id="memo" placeholder="例：〇〇発表会、秋の大会 / 2分40秒以内、明るい曲調など"></textarea>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="bar">
    <select id="sort" aria-label="並び替え"><option value="add">追加順</option><option value="seal">シール順</option></select>
    <div class="hint">タブはダブルタップで名前変更</div>
  </div>
  <details class="form" id="formBox">
    <summary>➕ 候補曲を追加する</summary>
    <label class="l" for="fTitle" style="margin-top:8px">曲名（必須）</label>
    <input type="text" id="fTitle" maxlength="80" placeholder="曲名">
    <label class="l" style="margin-top:8px">曲の長さ</label>
    <div class="row"><select id="fMin" aria-label="分"></select><select id="fSec" aria-label="秒"></select></div>
    <label class="l" for="fUrl" style="margin-top:8px">音源リンク（必須）YouTube / Spotify など</label>
    <input type="url" id="fUrl" placeholder="https://...">
    <label class="l" for="fNote" style="margin-top:8px">一言メモ（任意）</label>
    <input type="text" id="fNote" maxlength="120" placeholder="例：後半の盛り上がりが良い">
    <button class="primary" id="addSong" type="button">この曲をペタッと追加</button>
  </details>
  <div id="list"></div>
  <button class="arc" id="arcBtn" type="button">📁 これまでの選曲メモを見る</button>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="inst" role="dialog" aria-label="ホーム画面に追加"><span id="instMsg">ホーム画面に追加してアプリとして使う</span><button id="instOk" type="button">追加</button><button class="x" id="instNo" type="button" aria-label="閉じる">✕</button></div>
<script>
document.addEventListener('DOMContentLoaded',function(){
var KEY='erabooto_v1',mem=null;
var SEALS=[{c:'r',n:'第一候補',m:'1'},{c:'y',n:'検討中',m:'?'},{c:'b',n:'保留',m:'…'},{c:'g',n:'決定！',m:'✔'}];
var ORDER={g:0,r:1,y:2,b:3,'':4};
var D={genres:[],gid:'',sort:'add'};
function gc(){return D.genres.filter(function(g){return g.id===D.gid})[0]||D.genres[0]}
var S={get tabs(){return gc().tabs},set tabs(v){gc().tabs=v},get active(){return gc().active},set active(v){gc().active=v},get memo(){return gc().memo},set memo(v){gc().memo=v},get sort(){return D.sort},set sort(v){D.sort=v}};
var DEF=[['💃 ダンス',['オープニング','チーム曲','ソロ・ユニット','エンディング']],['⛸️ フィギュアスケート',['SP','FS','RD','FD','EX']],['🎺 楽器',['ソロ','連弾・アンサンブル','講師演奏・その他']],['🏃 運動会',['ダンス・表現','競技・リレー','入退場・BGM']],['📁 その他',['メイン','候補1','候補2']]];
function mkG(name,tn){var tabs=tn.map(function(n){return{id:uid(),name:n,songs:[]}});return{id:uid(),name:name,memo:'',tabs:tabs,active:tabs[0].id}}
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){mem=JSON.stringify(D)}}
function load(){var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){raw=mem}
 var n=null;try{if(raw)n=norm(JSON.parse(raw))}catch(e){}
 if(!n){n={genres:DEF.map(function(x){return mkG(x[0],x[1])}),gid:'',sort:'add'};n.gid=n.genres[0].id}
 D=n}
function cur(){return S.tabs.filter(function(t){return t.id===S.active})[0]||S.tabs[0]}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
var tt=null;function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1600)}
function safeUrl(u){try{var x=new URL(u);return(x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch(e){return''}}
function modal(build){var mask=el('div','mask'),m=el('div','modal');mask.appendChild(m);build(m);
 var c=el('button','close','閉じる');c.type='button';m.appendChild(c);
 function close(){if(mask.parentNode)mask.parentNode.removeChild(mask)}
 c.onclick=close;mask.onclick=function(e){if(e.target===mask)close()};document.body.appendChild(mask);return close}
function renderTabs(){var box=$('tabs');if(!box)return;box.innerHTML='';
 S.tabs.forEach(function(t){var b=el('button','tab'+(t.id===S.active?' on':''),t.name);b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',t.id===S.active);
  var last=0;
  b.onclick=function(){var n=Date.now();if(n-last<350){rename(t);last=0;return}last=n;S.active=t.id;save();render()};
  box.appendChild(b)});
 var a=el('button','tab add','＋ タブ追加');a.type='button';a.onclick=function(){var t={id:uid(),name:'新しいプログラム',songs:[]};S.tabs.push(t);S.active=t.id;save();render();toast('タブを追加しました');rename(t)};box.appendChild(a)}
function rename(t){modal(function(m){m.appendChild(el('h2',null,'タブの名前を変える'));
 var i=el('input');i.type='text';i.value=t.name;i.maxLength=24;i.setAttribute('aria-label','タブ名');m.appendChild(i);
 var ok=el('button','primary','この名前にする');ok.type='button';m.appendChild(ok);
 var del=el('button','close','このタブを削除');del.type='button';del.style.color='#D55E00';m.appendChild(del);
 ok.onclick=function(){var v=i.value.trim();if(!v){toast('名前を入力してね');return}t.name=v;save();render();toast('名前を変えました');var c=document.querySelector('.mask');if(c)c.parentNode.removeChild(c)};
 del.onclick=function(){if(S.tabs.length<2){toast('最後のタブは消せません');return}if(!confirm('「'+t.name+'」と中の曲を削除します。よいですか？'))return;S.tabs=S.tabs.filter(function(x){return x.id!==t.id});S.active=S.tabs[0].id;save();render();toast('削除しました');var c=document.querySelector('.mask');if(c)c.parentNode.removeChild(c)};
 setTimeout(function(){try{i.focus();i.select()}catch(e){}},50)})}
function renderList(){var box=$('list');if(!box)return;box.innerHTML='';var t=cur();if(!t)return;
 var songs=t.songs.slice();if(S.sort==='seal')songs.sort(function(a,b){return ORDER[a.seal||'']-ORDER[b.seal||'']});
 if(!songs.length){box.appendChild(el('div','empty','まだ曲がありません。上の「候補曲を追加する」から入れてみよう🎵'));return}
 songs.forEach(function(s){var c=el('div','card'+(s.seal==='g'?' sel-g':''));
  var top=el('div','top');top.appendChild(el('h3',null,s.title));if(s.len)top.appendChild(el('span','len','⏱ '+s.len));c.appendChild(top);
  if(s.note)c.appendChild(el('div','note',s.note));
  var seals=el('div','seals');seals.setAttribute('role','group');seals.setAttribute('aria-label','丸シール');
  SEALS.forEach(function(x){var b=el('button','seal');b.type='button';b.dataset.c=x.c;var on=s.seal===x.c;b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',x.n+(on?'（選択中）':''));b.title=x.n;
   b.appendChild(el('span','dot',x.m));b.appendChild(el('span','st',on?x.n+'✓':x.n));
   b.onclick=function(){s.seal=on?'':x.c;save();renderList();toast(on?'シールをはがしました':x.n+'をペタッ！')};seals.appendChild(b)});
  c.appendChild(seals);
  var acts=el('div','acts');var u=safeUrl(s.url||'');
  if(u){var a=el('a','link','▶ 音源を聴く');a.href=u;a.target='_blank';a.rel='noopener noreferrer';acts.appendChild(a)}
  var d=el('button','del','🗑 削除');d.type='button';d.onclick=function(){if(!confirm('「'+s.title+'」を削除しますか？'))return;t.songs=t.songs.filter(function(x){return x.id!==s.id});save();renderList();toast('削除しました')};acts.appendChild(d);
  c.appendChild(acts);box.appendChild(c)})}
function render(){try{renderGenres();renderTabs();renderList()}catch(e){try{console.error(e)}catch(_){}}}
function addSong(){var ti=$('fTitle'),mi=$('fMin'),se=$('fSec'),ur=$('fUrl'),no=$('fNote');if(!ti||!mi||!se||!ur||!no)return;
 var title=ti.value.trim();if(!title){toast('曲名を入力してね');ti.focus();return}
 var url=ur.value.trim();if(!url){toast('音源リンクを入力してね');ur.focus();return}
 if(!safeUrl(url)){toast('リンクは https:// から入力してね');ur.focus();return}
 var m=+mi.value,sc=+se.value,len=(m||sc)?(m+'分'+(sc<10?'0':'')+sc+'秒'):'';
 cur().songs.push({id:uid(),title:title,len:len,url:url,note:no.value.trim(),seal:''});
 ti.value=ur.value=no.value='';mi.value='0';se.value='0';save();renderList();toast('曲を追加しました🎵')}
function closeTop(){var c=document.querySelectorAll('.mask');if(c.length&&c[c.length-1].parentNode)c[c.length-1].parentNode.removeChild(c[c.length-1])}
function normTabs(arr){return(Array.isArray(arr)?arr:[]).slice(0,50).map(function(t){t=t||{};return{id:String(t.id||uid()),name:String(t.name||'タブ').slice(0,24),songs:(Array.isArray(t.songs)?t.songs:[]).slice(0,500).map(function(x){x=x||{};return{id:String(x.id||uid()),title:String(x.title||'(無題)').slice(0,80),len:String(x.len||'').slice(0,12),url:String(x.url||'').slice(0,500),note:String(x.note||'').slice(0,120),seal:('rybg'.indexOf(x.seal)>=0&&x.seal)?x.seal:''}})}})}
function norm(d){if(!d)return null;
 if(!Array.isArray(d.genres)&&Array.isArray(d.tabs))d={genres:[{id:uid(),name:'📁 その他',memo:d.memo,tabs:d.tabs,active:d.active}],sort:d.sort};
 if(!Array.isArray(d.genres)||!d.genres.length)return null;
 var gs=d.genres.slice(0,30).map(function(g){g=g||{};var tabs=normTabs(g.tabs);if(!tabs.length)tabs=[{id:uid(),name:'メイン',songs:[]}];
  return{id:String(g.id||uid()),name:String(g.name||'ジャンル').slice(0,24),memo:String(g.memo||'').slice(0,2000),tabs:tabs,active:tabs.some(function(t){return t.id===g.active})?g.active:tabs[0].id}});
 return{genres:gs,gid:gs.some(function(g){return g.id===d.gid})?d.gid:gs[0].id,sort:d.sort==='seal'?'seal':'add'}}
function applyState(n){D=n;save();var mo=$('memo'),so=$('sort');if(mo)mo.value=S.memo;if(so)so.value=D.sort;render()}
function gedit(g){modal(function(m){m.appendChild(el('h2',null,'ジャンルの名前を変える'));
 var i=el('input');i.type='text';i.value=g.name;i.maxLength=24;i.setAttribute('aria-label','ジャンル名');m.appendChild(i);
 var ok=el('button','primary','この名前にする');ok.type='button';m.appendChild(ok);
 var del=el('button','close','このジャンルを削除');del.type='button';del.style.color='#D55E00';m.appendChild(del);
 ok.onclick=function(){var v=i.value.trim();if(!v){toast('名前を入力してね');return}g.name=v;save();render();toast('名前を変えました');closeTop()};
 del.onclick=function(){if(D.genres.length<2){toast('最後のジャンルは消せません');return}if(!confirm('「'+g.name+'」と中の曲をすべて削除します。よいですか？'))return;D.genres=D.genres.filter(function(x){return x.id!==g.id});D.gid=D.genres[0].id;save();var mo=$('memo');if(mo)mo.value=S.memo;render();toast('削除しました');closeTop()};
 setTimeout(function(){try{i.focus();i.select()}catch(e){}},50)})}
function renderGenres(){var box=$('genres');if(!box)return;box.innerHTML='';
 D.genres.forEach(function(g){var b=el('button','tab gt'+(g.id===D.gid?' on':''),g.name);b.type='button';b.setAttribute('aria-pressed',g.id===D.gid);var last=0;
  b.onclick=function(){var n=Date.now();if(n-last<350){gedit(g);last=0;return}last=n;D.gid=g.id;save();var mo=$('memo');if(mo)mo.value=S.memo;render()};box.appendChild(b)});
 var a=el('button','tab add','＋ ジャンル追加');a.type='button';a.onclick=function(){var g=mkG('🎵 新ジャンル',['メイン','候補1','候補2']);D.genres.push(g);D.gid=g.id;save();var mo=$('memo');if(mo)mo.value=S.memo;render();toast('ジャンルを追加しました');gedit(g)};box.appendChild(a)}
function settings(){modal(function(m){m.appendChild(el('h2',null,'⚙️ 設定（データ管理）'));
 m.appendChild(el('h4',null,'💾 バックアップ'));
 var ta=el('textarea');ta.style.height='80px';ta.setAttribute('aria-label','バックアップ用テキスト');ta.placeholder='書き出したデータ／復元したいデータをここに';
 var dl=el('button','primary','JSONファイルとして保存');dl.type='button';
 dl.onclick=function(){try{var bl=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='erabooto-backup.json';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('保存しました')}catch(e){ta.value=JSON.stringify(D);toast('下のテキストをコピーして保存してね')}};
 var tx=el('button','close','テキストとして書き出す');tx.type='button';
 tx.onclick=function(){ta.value=JSON.stringify(D);try{ta.select()}catch(e){}toast('書き出しました。コピーして保存してね')};
 m.appendChild(dl);m.appendChild(tx);m.appendChild(ta);
 m.appendChild(el('h4',null,'📥 復元'));
